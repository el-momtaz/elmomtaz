<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- إن غيّرت مسار النشر (مثلاً إلى دومين في الجذر) عدّل href التالي إلى / -->
<base href="/elmomtaz/">
<title>الصفحة غير موجودة | الممتاز</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0D1B2A">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--primary:#0D1B2A;--accent:#FFC107;--accent-dark:#FF8F00;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;background:var(--primary);color:#fff;padding:40px 20px;direction:rtl;
  }
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
  .logo svg{width:52px;height:52px;}
  .logo b{font-size:26px;font-weight:800;}
  .logo small{display:block;font-size:12px;color:var(--accent);font-weight:700;}
  h1{font-size:110px;line-height:1;color:var(--accent);font-weight:900;margin-bottom:10px;}
  h2{font-size:24px;margin-bottom:12px;font-weight:800;}
  p{color:#B9C3D1;margin-bottom:30px;max-width:430px;line-height:1.8;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:50px;
    font-weight:700;font-size:15px;text-decoration:none;transition:.25s;
  }
  .btn-primary{background:var(--accent);color:var(--primary);}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-outline{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.35);}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent);}
  @media(max-width:480px){h1{font-size:80px;}}
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 56 56" aria-hidden="true">
      <rect x="1" y="1" width="54" height="54" rx="15" fill="#132A40" stroke="#FFC107" stroke-width="2"/>
      <path d="M32 12 L17 36 h11 l-3 14 L39 28 H28z" fill="#FFC107"/>
    </svg>
    <span>
      <b>الممتاز</b>
      <small>للأعمال الكهربائية</small>
    </span>
  </div>

  <h1>404</h1>
  <h2>عذراً، الصفحة غير موجودة</h2>
  <p>الرابط الذي تحاول الوصول إليه غير صحيح أو تم نقل الصفحة. يمكنك العودة للرئيسية أو تصفح خدماتنا.</p>

  <div class="actions">
    <a href="index.html" class="btn btn-primary">العودة للرئيسية</a>
    <a href="services.html" class="btn btn-outline">تصفح خدماتنا</a>
    <a href="booking.html" class="btn btn-outline">احجز موعد</a>
    <a href="tel:+966508980434" class="btn btn-outline">0508980434</a>
  </div>
</body>
</html>
