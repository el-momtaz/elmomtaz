<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | لوحة تحكم الممتاز</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <img src="assets/logo.svg" alt="الممتاز">
    <h2>تسجيل الدخول</h2>
    <p>لوحة تحكم إدارة الموقع</p>
    <div class="error-msg" id="errorMsg">خطأ في البريد أو كلمة المرور</div>
    <form id="loginForm">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="username" required placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" required placeholder="أدخل كلمة المرور">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
        <i class="fas fa-sign-in-alt"></i> دخول
      </button>
    </form>
    <p style="margin-top:20px;"><a href="index.html" style="color:var(--gray);font-size:13px;"><i class="fas fa-arrow-right"></i> العودة للموقع</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  auth.onAuthStateChanged(function(user){
    if(user) window.location.href = 'admin.html';
  });

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    login(email, password)
      .then(()=> window.location.href = 'admin.html')
      .catch(function(err){
        errorMsg.textContent = 'خطأ: البريد أو كلمة المرور غير صحيحة';
        errorMsg.style.display = 'block';
      });
  });
</script>
</body>
</html>
